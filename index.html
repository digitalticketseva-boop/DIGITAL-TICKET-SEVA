<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Ticket Seva | Online Services</title>

<meta name="description" content="Digital Ticket Seva - Flight, Train, Bus Ticket Booking, PAN Card, Passport, Driving Licence, Insurance, Recharge and Digital Services.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    color:#172033;
    line-height:1.6;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#0757c9,#063b8f);
    color:white;
    text-align:center;
    padding:45px 20px;
}

.logo-box{
    width:80px;
    height:80px;
    margin:auto;
    background:white;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0757c9;
    font-size:38px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

header h1{
    font-size:38px;
    margin-top:15px;
}

header p{
    font-size:18px;
    margin-top:8px;
}

/* NAVIGATION */
nav{
    background:white;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

nav a{
    display:inline-block;
    color:#0757c9;
    text-decoration:none;
    font-weight:bold;
    margin:5px 12px;
}

nav a:hover{
    color:#f28c00;
}

/* HERO */
.hero{
    max-width:1100px;
    margin:30px auto;
    padding:50px 25px;
    border-radius:25px;
    background:linear-gradient(135deg,#ffffff,#eaf2ff);
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.hero h2{
    font-size:34px;
    color:#0757c9;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    max-width:750px;
    margin:auto;
}

.buttons{
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:13px 25px;
    margin:7px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    background:#0757c9;
    color:white;
    box-shadow:0 5px 15px rgba(7,87,201,.25);
}

.btn:hover{
    background:#f28c00;
}

/* SECTION */
section{
    max-width:1100px;
    margin:45px auto;
    padding:0 20px;
}

.section-title{
    text-align:center;
    color:#0757c9;
    font-size:30px;
    margin-bottom:25px;
}

/* SERVICE CARDS */
.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px 18px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    transition:.3s;
    border-top:4px solid #0757c9;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 25px rgba(0,0,0,.13);
}

.icon{
    font-size:42px;
    margin-bottom:10px;
}

.card h3{
    color:#0757c9;
    margin-bottom:8px;
}

/* ABOUT */
.about{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    text-align:center;
}

/* CONTACT */
.contact-box{
    background:linear-gradient(135deg,#0757c9,#063b8f);
    color:white;
    padding:35px 20px;
    border-radius:22px;
    text-align:center;
}

.contact-box h2{
    margin-bottom:15px;
}

.contact-box p{
    margin:8px 0;
    font-size:17px;
}

.contact-btn{
    display:inline-block;
    background:white;
    color:#0757c9;
    padding:12px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    margin-top:15px;
}

/* FOOTER */
footer{
    background:#101828;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:50px;
}

footer p{
    margin:5px;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding:35px 15px;
    }

    header h1{
        font-size:28px;
    }

    header p{
        font-size:15px;
    }

    .hero{
        margin:20px 12px;
        padding:35px 18px;
    }

    .hero h2{
        font-size:27px;
    }

    .hero p{
        font-size:16px;
    }

    .section-title{
        font-size:26px;
    }

    nav a{
        margin:4px 7px;
        font-size:14px;
    }

}
</style>
</head>

</nav>
